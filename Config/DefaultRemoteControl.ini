[/Script/RemoteControlCommon.RemoteControlSettings]
; Remote Control refuses every function call it has not been told about, which is the right
; default for something listening on a port. This opens exactly one: the door the browser lab
; pushes a map through, and nothing else. Measured before adding it:
;   "Executing function 'ViperMapPushLibrary PushMapJson' is not allowed by remote control
;    settings. (see 'Custom Allowed Remote Function Calls' or 'Allow Any Remote Function Call')"
; The blunt alternative, bAllowAnyRemoteFunctionCall, would let anything on this machine call
; anything in the editor, so it stays off.
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Multiplayer_GASEditor.ViperMapPushLibrary",FunctionName="PushMapJson")
